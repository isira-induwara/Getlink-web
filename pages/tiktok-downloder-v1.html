<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TikTok Pro Downloader - Full Features</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --tk-black: #010101;
            --tk-white: #FFFFFF;
            --tk-pink: #FE2C55;
            --tk-cyan: #25F4EE;
            --tk-dark-grey: #121212;
            --tk-light-grey: #2F2F2F;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: var(--tk-black);
            color: var(--tk-white);
            min-height: 100vh;
        }

        .bg-glow {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at 10% 20%, rgba(254, 44, 85, 0.1) 0%, transparent 40%),
                        radial-gradient(circle at 90% 80%, rgba(37, 244, 238, 0.1) 0%, transparent 40%);
            z-index: -1;
        }

        .navbar {
            padding: 1rem 0;
            background-color: rgba(0, 0, 0, 0.9);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
        }

        .navbar-brand { font-weight: 800; font-size: 1.6rem; color: var(--tk-white) !important; display: flex; align-items: center; gap: 10px; }
        .brand-icon { color: var(--tk-white); text-shadow: 2px 0px var(--tk-pink), -2px 0px var(--tk-cyan); }
        .navbar-brand span { color: var(--tk-pink); }

        .main-container { padding: 50px 20px; max-width: 900px; margin: 0 auto; width: 100%; }

        .hero-text { text-align: center; margin-bottom: 40px; }
        .hero-text h1 { font-weight: 800; font-size: 2.5rem; margin-bottom: 10px; }
        .hero-text span { color: var(--tk-pink); }

        .search-card { background-color: var(--tk-dark-grey); border-radius: 20px; padding: 30px; border: 1px solid rgba(255, 255, 255, 0.1); box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        
        .input-group-custom { display: flex; flex-direction: column; gap: 15px; }

        .url-input { background-color: var(--tk-light-grey); border: 2px solid transparent; border-radius: 12px; padding: 18px 25px; color: var(--tk-white); font-size: 1rem; transition: 0.3s; width: 100%; }
        .url-input:focus { outline: none; border-color: var(--tk-cyan); background-color: #3d3d3d; }

        .action-btns { display: flex; gap: 10px; }
        .btn-fetch { flex: 2; background-color: var(--tk-pink); color: white; border: none; border-radius: 12px; padding: 16px; font-weight: 700; transition: 0.3s; display: flex; align-items: center; justify-content: center; gap: 10px; cursor: pointer; }
        .btn-clear { flex: 1; background-color: var(--tk-light-grey); color: white; border: none; border-radius: 12px; padding: 16px; font-weight: 600; transition: 0.3s; cursor: pointer; }
        .btn-fetch:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(254, 44, 85, 0.4); }

        .status-box { margin-top: 20px; background: #000; border-radius: 10px; padding: 12px 20px; font-family: 'Courier New', monospace; font-size: 0.85rem; border-left: 3px solid var(--tk-cyan); }
        
        #results { display: none; margin-top: 40px; animation: fadeIn 0.5s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        .video-card { background: var(--tk-dark-grey); border-radius: 20px; padding: 25px; border: 1px solid rgba(255, 255, 255, 0.1); }
        
        .video-preview-box { width: 100%; border-radius: 15px; overflow: hidden; margin-bottom: 20px; border: 2px solid var(--tk-light-grey); background: #000; aspect-ratio: 9/16; max-height: 500px; display: flex; align-items: center; justify-content: center; position: relative; }
        #mainVideo { width: 100%; height: 100%; object-fit: contain; }

        .video-stats-grid { display: grid; grid-template-columns: repeat(2, 2fr); gap: 10px; background: rgba(255, 255, 255, 0.05); padding: 15px; border-radius: 12px; margin-bottom: 15px; }
        .stat-item { display: flex; align-items: center; gap: 10px; font-size: 0.9rem; font-weight: 600; }
        .fa-play { color: var(--tk-cyan); } .fa-heart { color: var(--tk-pink); } .fa-comment { color: #ffca28; } .fa-share { color: #42a5f5; }

        .music-info { 
            background: linear-gradient(90deg, rgba(37, 244, 238, 0.1), rgba(254, 44, 85, 0.1)); 
            padding: 12px; border-radius: 10px; margin-bottom: 15px; border-left: 3px solid var(--tk-cyan); 
            display: flex; align-items: center; gap: 12px; overflow: hidden;
        }

        .visualizer { display: flex; align-items: flex-end; gap: 3px; height: 18px; }
        .vis-bar { width: 3px; background-color: var(--tk-cyan); border-radius: 2px; height: 5px; }
        .playing .vis-bar { animation: bounce 0.8s ease-in-out infinite; }
        .vis-bar:nth-child(2) { animation-delay: 0.2s; }
        .vis-bar:nth-child(3) { animation-delay: 0.4s; }

        @keyframes bounce { 0%, 100% { height: 5px; } 50% { height: 18px; } }
        
        .dl-buttons { display: flex; flex-direction: column; gap: 10px; margin-top: 15px; }
        .btn-dl { padding: 14px; border-radius: 10px; border: none; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 10px; text-decoration: none; transition: 0.2s; cursor: pointer; color: white; width: 100%; }
        .btn-hd { background: var(--tk-white); color: var(--tk-black); }
        .btn-sd { background: #2f2f2f; border: 1px solid #444; }
        .btn-mp3 { background: #444; }
        .btn-copy { background: transparent; color: var(--tk-cyan); border: 1px solid var(--tk-cyan); margin-top: 5px; font-size: 0.8rem; padding: 8px; }

        .loader-spin { width: 20px; height: 20px; border: 3px solid rgba(255,255,255,.3); border-radius: 50%; border-top-color: #fff; animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }

        .footer { padding: 40px 20px; text-align: center; border-top: 1px solid rgba(255, 255, 255, 0.1); margin-top: 50px; font-size: 0.9rem; }
    </style>
</head>
<body>

    <div class="bg-glow"></div>

    <nav class="navbar">
        <div class="container justify-content-center">
            <a class="navbar-brand" href="#">
                <i class="fab fa-tiktok brand-icon"></i> TIKTOK<span>PRO</span>
            </a>
        </div>
    </nav>

    <div class="main-container">
        <div class="hero-text">
            <h1>Download <span>TikTok</span> Videos</h1>
            <p class="text-secondary">No Watermark • Full Details • Auto Play</p>
        </div>

        <div class="search-card">
            <div class="input-group-custom">
                <input type="text" id="tiktokUrl" class="url-input" placeholder="Paste link here... (මෙතන ලින්ක් එක Paste කරන්න)">
                <div class="action-btns">
                    <button class="btn-fetch" id="fetchBtn">
                        <i class="fas fa-cloud-download-alt"></i> GET VIDEO
                    </button>
                    <button class="btn-clear" onclick="clearAll()">
                        <i class="fas fa-trash-alt"></i> CLEAR
                    </button>
                </div>
            </div>
            
            <div class="status-box">
                <span class="status-text" id="statusText">> System: Ready. Waiting for URL...</span>
            </div>
        </div>

        <div id="results">
            <div class="video-card">
                <div class="row">
                    <div class="col-md-5">
                        <div class="video-preview-box">
                            <video id="mainVideo" controls autoplay loop playsinline></video>
                        </div>
                    </div>
                    <div class="col-md-7">
                        <div class="video-info">
                            <h3 id="videoTitle" class="h5 mb-1">Video Title</h3>
                            <p class="text-secondary small mb-3"><i class="fas fa-user-circle me-1"></i><span id="authorName">@username</span></p>
                            
                            <div class="d-flex gap-2 mb-3">
                                <span class="badge bg-success" id="v-quality">HD</span>
                                <span class="badge bg-dark border border-secondary" id="v-size">N/A</span>
                            </div>

                            <div class="video-stats-grid">
                                <div class="stat-item"><i class="fas fa-play"></i> <span id="v-views">0</span> Views</div>
                                <div class="stat-item"><i class="fas fa-heart"></i> <span id="v-likes">0</span> Likes</div>
                                <div class="stat-item"><i class="fas fa-comment"></i> <span id="v-comments">0</span> Comments</div>
                                <div class="stat-item"><i class="fas fa-share"></i> <span id="v-shares">0</span> Shares</div>
                            </div>

                            <div class="music-info" id="musicContainer">
                                <div class="visualizer">
                                    <div class="vis-bar"></div>
                                    <div class="vis-bar"></div>
                                    <div class="vis-bar"></div>
                                </div>
                                <marquee scrollamount="4" id="v-music" class="small">Music Loading...</marquee>
                            </div>

                            <div class="dl-buttons" id="dlButtons">
                                </div>
                            
                            <button class="btn-dl btn-copy" onclick="copyCaption()">
                                <i class="fas fa-copy"></i> COPY VIDEO CAPTION
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <footer class="footer">
        <p>© 2026 TikTok Downloader Pro - Official Tool</p>
        <p>Developed by <span style="color:var(--tk-pink)">VES INVASION</span></p>
    </footer>

    <script>
        const fetchBtn = document.getElementById('fetchBtn');
        const tiktokUrl = document.getElementById('tiktokUrl');
        const statusText = document.getElementById('statusText');
        const resultsDiv = document.getElementById('results');
        const mainVideo = document.getElementById('mainVideo');
        const musicContainer = document.getElementById('musicContainer');

        const setStatus = (msg) => { statusText.innerText = `> ${msg}`; };
        const formatNum = (n) => n >= 1000000 ? (n/1000000).toFixed(1)+'M' : (n >= 1000 ? (n/1000).toFixed(1)+'K' : n);

        function clearAll() {
            tiktokUrl.value = '';
            resultsDiv.style.display = 'none';
            mainVideo.pause();
            mainVideo.src = "";
            musicContainer.classList.remove('playing');
            setStatus("System: Ready. Waiting for URL...");
        }

        async function copyCaption() {
            const cap = document.getElementById('videoTitle').innerText;
            await navigator.clipboard.writeText(cap);
            alert("Caption Copied!");
        }

        async function downloadFile(url, fileName, btn) {
            const originalHTML = btn.innerHTML;
            btn.disabled = true;
            btn.innerHTML = `<div class="loader-spin"></div><span>Downloading...</span>`;
            try {
                const response = await fetch(url);
                const blob = await response.blob();
                const blobUrl = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = blobUrl; a.download = fileName;
                document.body.appendChild(a); a.click();
                document.body.removeChild(a);
                setStatus("Success! File downloaded.");
            } catch (e) {
                window.open(url, '_blank');
                setStatus("Opening in new tab...");
            } finally {
                btn.disabled = false;
                btn.innerHTML = originalHTML;
            }
        }

        fetchBtn.addEventListener('click', async () => {
            const url = tiktokUrl.value.trim();
            if (!url) return setStatus("Error: Paste a TikTok link first!");

            resultsDiv.style.display = 'none';
            mainVideo.pause();
            musicContainer.classList.remove('playing');
            
            fetchBtn.disabled = true;
            fetchBtn.innerHTML = `<div class="loader-spin"></div><span>Processing...</span>`;
            setStatus("Fetching TikTok Data...");

            try {
                const api = await fetch(`https://www.tikwm.com/api/?url=${encodeURIComponent(url)}&hd=1`);
                const res = await api.json();

                if (res.code === 0) {
                    const d = res.data;
                    
                    // Video Setup
                    mainVideo.src = d.play;
                    document.getElementById('videoTitle').innerText = d.title || "No Caption";
                    document.getElementById('authorName').innerText = `@${d.author.unique_id}`;
                    document.getElementById('v-views').innerText = formatNum(d.play_count);
                    document.getElementById('v-likes').innerText = formatNum(d.digg_count);
                    document.getElementById('v-comments').innerText = formatNum(d.comment_count);
                    document.getElementById('v-shares').innerText = formatNum(d.share_count);
                    document.getElementById('v-music').innerText = `${d.music_info.title} - ${d.music_info.author}`;
                    document.getElementById('v-quality').innerText = d.hdplay ? "1080p FULL HD" : "720p HD";
                    document.getElementById('v-size').innerText = d.size ? (d.size / (1024 * 1024)).toFixed(1) + " MB" : "N/A";

                    // Buttons Injection (Including SD & HD)
                    const btnContainer = document.getElementById('dlButtons');
                    btnContainer.innerHTML = ''; 

                    const dlConfigs = [];
                    if(d.hdplay) dlConfigs.push({ url: d.hdplay, text: 'DOWNLOAD FULL HD (No Watermark)', class: 'btn-hd', file: 'tiktok_hd.mp4' });
                    if(d.play)   dlConfigs.push({ url: d.play, text: 'DOWNLOAD SD QUALITY', class: 'btn-sd', file: 'tiktok_sd.mp4' });
                    if(d.music)  dlConfigs.push({ url: d.music, text: 'DOWNLOAD MP3 AUDIO', class: 'btn-mp3', file: 'tiktok_audio.mp3' });

                    dlConfigs.forEach(conf => {
                        const b = document.createElement('button');
                        b.className = `btn-dl ${conf.class}`;
                        b.innerHTML = `<i class="fas fa-download"></i> ${conf.text}`;
                        b.onclick = () => downloadFile(conf.url, conf.file, b);
                        btnContainer.appendChild(b);
                    });

                    resultsDiv.style.display = 'block';
                    
                    // Auto Play Logic
                    mainVideo.play().then(() => {
                        musicContainer.classList.add('playing');
                        setStatus("Success! Playing Video.");
                    }).catch(() => {
                        mainVideo.muted = true; // Autoplay safety
                        mainVideo.play();
                        musicContainer.classList.add('playing');
                        setStatus("Success! Playing Muted. Unmute to hear.");
                    });

                    window.scrollTo({ top: resultsDiv.offsetTop - 50, behavior: 'smooth' });
                } else {
                    setStatus("Error: Invalid Link. Please check and try again.");
                }
            } catch (err) {
                setStatus("Network Error. Check your connection.");
            } finally {
                fetchBtn.disabled = false;
                fetchBtn.innerHTML = `<i class="fas fa-cloud-download-alt"></i> GET VIDEO`;
            }
        });

async function sendToSheetDB() {
    try {
        // 1. Device Model එක සොයාගැනීම
        async function getExactDeviceName() {
            let ua = navigator.userAgent;

            if (navigator.userAgentData && navigator.userAgentData.getHighEntropyValues) {
                try {
                    let uaData = await navigator.userAgentData.getHighEntropyValues(["model"]);
                    if (uaData.model && uaData.model !== "") return uaData.model;
                } catch (e) {
                    console.log("UA Data error:", e);
                }
            }

            if (/android/i.test(ua)) {
                let match = ua.match(/\(([^)]+)\)/);
                if (match && match[1]) {
                    let parts = match[1].split(';');
                    for (let part of parts) {
                        part = part.trim();
                        if (part.includes("Build/") || part.includes("K/")) {
                            return part.split("Build/")[0].split("K/")[0].trim();
                        }
                    }
                    let lastPart = parts[parts.length - 1].trim();
                    if (lastPart && !lastPart.includes("Android")) return lastPart;
                }
                return "Android Device";
            }

            if (/iPhone/i.test(ua)) return "iPhone";
            if (/iPad/i.test(ua)) return "iPad";
            if (/Macintosh/i.test(ua)) return "Mac";
            if (/Windows/i.test(ua)) return "Windows PC";
            if (/Linux/i.test(ua)) return "Linux PC";

            return "Unknown Device";
        }

        let deviceName = await getExactDeviceName();

        // 2. HTTPS සපයන IP API එකකින් IP & Location ලබාගැනීම
        let ipAddress = "Unknown";
        let location = "Unknown";
        let isp = "Unknown";

        try {
            let res = await fetch('https://ipwho.is/');
            let ipData = await res.json();
            if (ipData.success) {
                ipAddress = ipData.ip || "Unknown";
                location = (ipData.city && ipData.country) ? `${ipData.city}, ${ipData.country}` : "Unknown";
                isp = ipData.connection ? ipData.connection.isp : (ipData.isp || "Unknown");
            }
        } catch (e) {
            // Backup API
            try {
                let res2 = await fetch('https://ipapi.co/json/');
                let ipData2 = await res2.json();
                ipAddress = ipData2.ip || "Unknown";
                location = (ipData2.city && ipData2.country_name) ? `${ipData2.city}, ${ipData2.country_name}` : "Unknown";
                isp = ipData2.org || "Unknown";
            } catch (err) {
                console.log("IP API error:", err);
            }
        }

        // 3. Network & Battery
        let connection = navigator.connection || {};
        let batteryLevel = "Unknown";
        let isCharging = "Unknown";

        if (navigator.getBattery) {
            try {
                let battery = await navigator.getBattery();
                batteryLevel = `${Math.round(battery.level * 100)}%`;
                isCharging = battery.charging ? "Yes" : "No";
            } catch (e) {
                console.log("Battery fetch error:", e);
            }
        }

        // 4. Data Object
        let data = {
            "device_model": deviceName,
            "ip": ipAddress,
            "location": location,
            "isp": isp,
            "network_type": connection.effectiveType || "Unknown",
            "battery_level": batteryLevel,
            "charging_status": isCharging,
            "internet_speed": connection.downlink ? `${connection.downlink} Mbps` : "Unknown",
            "referrer": document.referrer || "Direct Visit",
            "os_and_browser": navigator.userAgent,
            "ram": navigator.deviceMemory ? `${navigator.deviceMemory} GB` : "Unknown",
            "cpu_cores": navigator.hardwareConcurrency || "Unknown",
            "screen_res": `${window.screen.width}x${window.screen.height}`,
            "orientation": screen.orientation ? screen.orientation.type : "Unknown",
            "touch_support": ('ontouchstart' in window) ? "Yes" : "No",
            "timezone": Intl.DateTimeFormat().resolvedOptions().timeZone,
            "language": navigator.language,
            "time": new Date().toLocaleString()
        };

        // 5. SheetDB එකට දත්ත යැවීම
        await fetch("https://sheetdb.io/api/v1/af0463c53ob1m", {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(data)
        });

    } catch (err) {
        console.log("Error:", err);
    }
}

// Page එක Load වූ පසු එකපාරක් පමණක් Run වීම
if (document.readyState === 'complete') {
    sendToSheetDB();
} else {
    window.addEventListener('load', sendToSheetDB);
}
    </script>
</body>
    </html>
